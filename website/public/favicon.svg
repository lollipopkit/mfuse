<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Simplified from MFuse/Assets.xcassets/AppIcon: white tile, glassy teal drive, frosted cloud. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff2f3"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdde3"/>
      <stop offset="1" stop-color="#78c6d1"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e3e6"/>
      <stop offset="0.5" stop-color="#75c1ce"/>
      <stop offset="1" stop-color="#9adadc"/>
    </linearGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="36">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#c3e1e9"/>
    </linearGradient>
  </defs>

  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#tile)" stroke="#e1e5e7"/>

  <!-- Drive: top face, the cloud's shadow on it, then the front band. -->
  <path d="M20 17h25.5q3 0 3.4 3L51 41H13l2.6-21q.4-3 3.4-3z" fill="url(#top)" stroke="#b8eef0" stroke-width=".7"/>
  <ellipse cx="30" cy="35" rx="8" ry="5" fill="#5fa3b2" opacity=".3"/>
  <rect x="12.5" y="40" width="39" height="11" rx="4.5" fill="url(#band)"/>
  <rect x="15" y="40.9" width="34" height="1.2" rx=".6" fill="#d4f4f4" opacity=".8"/>

  <!-- Cloud, overlapping the drive's upper right. The white rim is the same shapes stroked
       underneath, so the fill above hides the strokes where the parts overlap. -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1.3">
    <rect x="24" y="26" width="31" height="10" rx="5"/>
    <circle cx="36.5" cy="24" r="8.5"/>
    <circle cx="47.5" cy="27.5" r="5.5"/>
    <circle cx="29.5" cy="30.5" r="5.5"/>
  </g>
  <g fill="url(#cloud)">
    <rect x="24" y="26" width="31" height="10" rx="5"/>
    <circle cx="36.5" cy="24" r="8.5"/>
    <circle cx="47.5" cy="27.5" r="5.5"/>
    <circle cx="29.5" cy="30.5" r="5.5"/>
  </g>
</svg>
